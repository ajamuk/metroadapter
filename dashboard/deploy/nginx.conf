# Nginx config for dashboard.crossfitmpo.com
# Place in /etc/nginx/sites-available/crossfitmpo-dashboard
# Enable: ln -s /etc/nginx/sites-available/crossfitmpo-dashboard /etc/nginx/sites-enabled/
# Then: certbot --nginx -d dashboard.crossfitmpo.com

server {
    listen 80;
    server_name dashboard.crossfitmpo.com;
    # Certbot will add SSL redirect here automatically
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name dashboard.crossfitmpo.com;

    # SSL — managed by Certbot
    # ssl_certificate     /etc/letsencrypt/live/dashboard.crossfitmpo.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/dashboard.crossfitmpo.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header X-XSS-Protection "1; mode=block";

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    # Static files (served directly by nginx, faster)
    location /static/ {
        alias /opt/crossfitmpo-dashboard/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # App — proxy to gunicorn
    location / {
        proxy_pass         http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30;
        proxy_buffering    off;
    }

    access_log /var/log/nginx/crossfitmpo-dashboard-access.log;
    error_log  /var/log/nginx/crossfitmpo-dashboard-error.log;
}
